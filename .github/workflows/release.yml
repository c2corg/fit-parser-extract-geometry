name: Release

on:
  push:
    tags:
      - 'v[1-9]+.[0-9]+.[0-9]+'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
  publish-npm:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no token needed
    strategy:
      matrix:
        node-version: [lts/*]
    steps:
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
      - name: Checkout code
        uses: actions/checkout@v7
      - run: npm ci
      # Trusted publisher configured on npmjs.com for this repository and workflow
      # (https://docs.npmjs.com/trusted-publishers), provenance is generated automatically
      - run: npm publish --access public
